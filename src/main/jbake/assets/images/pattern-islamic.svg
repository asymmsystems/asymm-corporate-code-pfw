<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <g fill="none" stroke="#1D1C1A" stroke-width="0.5" stroke-linejoin="miter">
    <!-- Upright square -->
    <rect x="14.65" y="14.65" width="70.7" height="70.7"/>
    <!-- Rotated square (diamond) - forms 8-point star when overlaid -->
